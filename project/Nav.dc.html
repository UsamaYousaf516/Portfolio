<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="width:100%;display:flex;flex-direction:column;align-items:center;padding:14px 16px 0;box-sizing:border-box;font-family:Manrope, sans-serif;position:relative;">
  <nav style="width:100%;max-width:1200px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#17100B;border-radius:999px;padding:8px 8px 8px 10px;box-shadow:0 10px 30px -12px rgba(23,16,11,0.45);box-sizing:border-box;">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;">
      <span style="width:38px;height:38px;border-radius:50%;background:#F5A000;color:#17100B;display:flex;align-items:center;justify-content:center;font-family:Unbounded, sans-serif;font-weight:700;font-size:13px;letter-spacing:-0.02em;">UY</span>
      <span style="color:#F7F4EA;font-family:Unbounded, sans-serif;font-weight:600;font-size:16px;letter-spacing:-0.02em;">Usama<span style="color:#F5A000;">.</span></span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:4px;">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <sc-if value="{{ l.active }}">
            <a href="{{ l.href }}" style="color:#F5A000;text-decoration:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:rgba(245,160,0,0.1);">{{ l.label }}</a>
          </sc-if>
          <sc-if value="{{ l.inactive }}">
            <a href="{{ l.href }}" style="color:#CFC5B8;text-decoration:none;font-size:13px;font-weight:500;padding:8px 12px;border-radius:999px;transition:color .2s, background .2s;" style-hover="color:#F7F4EA;background:rgba(247,244,234,0.06);">{{ l.label }}</a>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <button aria-label="Toggle dark mode" title="Toggle dark mode" onClick="{{ toggleTheme }}" style="width:40px;height:40px;border-radius:50%;border:1px solid #3A2E24;background:transparent;color:#F7F4EA;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s, color .2s;" style-hover="border-color:#F5A000;color:#F5A000;">
        <sc-if value="{{ isLight }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
        <sc-if value="{{ isDark }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5A000" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      </button>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <a data-magnetic="0.25" href="Contact.dc.html" style="display:flex;align-items:center;gap:8px;background:#F7F4EA;color:#17100B;text-decoration:none;font-weight:700;font-size:13px;padding:11px 18px;border-radius:999px;transition:background .2s;" style-hover="background:#F5A000;">Let's Talk <span style="font-size:14px;">→</span></a>
      </sc-if>
      <sc-if value="{{ isMobile }}">
        <button aria-label="{{ menuLabel }}" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}" style="width:44px;height:44px;border-radius:50%;border:none;background:#F5A000;color:#17100B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;">
          <sc-if value="{{ menuClosed }}">
            <span style="width:18px;height:2px;border-radius:2px;background:#17100B;"></span>
            <span style="width:18px;height:2px;border-radius:2px;background:#17100B;"></span>
            <span style="width:12px;height:2px;border-radius:2px;background:#17100B;margin-left:6px;"></span>
          </sc-if>
          <sc-if value="{{ menuOpen }}"><span style="font-size:20px;font-weight:700;line-height:1;">✕</span></sc-if>
        </button>
      </sc-if>
    </div>
  </nav>

  <sc-if value="{{ showPanel }}">
    <div style="position:absolute;top:calc(100% + 8px);left:16px;right:16px;max-width:1200px;margin:0 auto;background:#17100B;border-radius:28px;padding:10px;box-sizing:border-box;box-shadow:0 24px 48px -20px rgba(23,16,11,0.55);display:flex;flex-direction:column;gap:2px;border:1px solid #3A2E24;">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <sc-if value="{{ l.active }}">
          <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 18px;border-radius:18px;background:rgba(245,160,0,0.12);color:#F5A000;text-decoration:none;font-family:Unbounded, sans-serif;font-weight:600;font-size:18px;letter-spacing:-0.02em;">{{ l.label }}<span style="width:8px;height:8px;border-radius:50%;background:#F5A000;"></span></a>
        </sc-if>
        <sc-if value="{{ l.inactive }}">
          <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 18px;border-radius:18px;color:#F7F4EA;text-decoration:none;font-family:Unbounded, sans-serif;font-weight:600;font-size:18px;letter-spacing:-0.02em;" style-active="background:rgba(247,244,234,0.06);">{{ l.label }}<span style="color:#6E655C;font-size:16px;">→</span></a>
        </sc-if>
      </sc-for>
      <a href="Contact.dc.html" onClick="{{ closeMenu }}" style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:999px;background:#F5A000;color:#17100B;text-decoration:none;font-weight:800;font-size:15px;">Let's Talk →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;projects&quot;,&quot;experience&quot;,&quot;skills&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { dark: document.documentElement.getAttribute('data-theme') === 'dark', w: window.innerWidth, open: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth, open: window.innerWidth >= 960 ? false : this.state.open });
    window.addEventListener('resize', this.onResize);
    this.onKey = (e) => { if (e.key === 'Escape') this.setState({ open: false }); };
    window.addEventListener('keydown', this.onKey);
    const sync = () => window.uyFx && window.uyFx.onTheme(d => this.setState({ dark: d }));
    if (window.uyFx) { sync(); this.setState({ dark: window.uyFx.isDark() }); }
    else setTimeout(() => { sync(); window.uyFx && this.setState({ dark: window.uyFx.isDark() }); }, 300);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('keydown', this.onKey);
  }
  renderVals() {
    const mobile = this.state.w < 960;
    const open = mobile && this.state.open;
    const a = this.props.active ?? 'home';
    const links = [
      ['home', 'Home', 'Home.dc.html'],
      ['about', 'About', 'About.dc.html'],
      ['projects', 'Projects', 'Projects.dc.html'],
      ['experience', 'Experience', 'Home.dc.html#experience'],
      ['skills', 'Skills', 'Home.dc.html#skills'],
      ['contact', 'Contact', 'Contact.dc.html'],
    ].map(([k, label, href]) => ({ label, href, active: k === a, inactive: k !== a }));
    return {
      links,
      isDark: this.state.dark, isLight: !this.state.dark,
      toggleTheme: () => window.uyFx && window.uyFx.toggleTheme(),
      isMobile: mobile, isDesktop: !mobile,
      menuOpen: open, menuClosed: !open, showPanel: open,
      menuLabel: open ? 'Close menu' : 'Open menu',
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      closeMenu: () => this.setState({ open: false }),
    };
  }
}
</script>
</body>
</html>
