<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes uyTicker { from { transform: translateX(0); } to { transform: translateX(-50%); } }</style>
</helmet>
<div style="width:100%;background:#17100B;overflow:hidden;padding:22px 0;border-top:2px solid #F5A000;border-bottom:2px solid #F5A000;">
  {{ track }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:10,&quot;max&quot;:90,&quot;step&quot;:5,&quot;default&quot;:40,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = this.props.items ?? ['Flutter Development','Mobile Apps','Web Applications','Firebase','Supabase','REST APIs','Realtime Systems','AI-Assisted Development','Product Engineering'];
    const h = React.createElement;
    const row = (k) => items.map((t, i) => h('span', { key: k + i, 'data-m': 'tick-row', style: { display: 'inline-flex', alignItems: 'center', gap: 36, paddingRight: 36 } },
      h('span', { 'data-m': 'tick', style: { color: '#F7F4EA', fontFamily: 'Unbounded, sans-serif', fontWeight: 600, fontSize: 22, letterSpacing: '-0.02em' } }, t),
      h('span', { style: { color: '#F5A000', fontSize: 22 } }, '✦')));
    const track = h('div', { style: { display: 'inline-flex', whiteSpace: 'nowrap', animation: `uyTicker ${this.props.speed ?? 40}s linear infinite` } }, row('a'), row('b'));
    return { track };
  }
}
</script>
</body>
</html>
